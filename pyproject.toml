[project]
name = "voiceguard"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Adam Khoury", email = "229741132+adamkhouryedy2308-eng@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "jupyter>=1.1.1",
    "librosa>=1.0.1",
    "matplotlib>=3.11.2",
    "numpy>=2.5.5",
    "soundfile>=0.14.0",
]

[project.scripts]
voiceguard = "voiceguard:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
