[project]
name = "voiceguard"
version = "0.1.0"
description = "Detects AI-generated (deepfake) speech: SSL-AASIST fine-tuned on ASVspoof, tested on real-world audio"
readme = "README.md"
authors = [
    { name = "Adam Khoury" }
]
requires-python = ">=3.12"
dependencies = [
    "jupyter>=1.1.1",
    "librosa>=1.0.1",
    "matplotlib>=3.11.2",
    "numpy>=2.5.5",
    "scikit-learn>=1.9.1",
    "soundfile>=0.14.0",
    "torch>=2.15.0",
    "transformers>=5.23.0",
]

[project.scripts]
voiceguard = "voiceguard:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
